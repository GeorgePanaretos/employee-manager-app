databaseChangeLog:
  - changeSet:
      id: create-department-table
      author: georgepanaretos
      changes:
        - createTable:
            tableName: department
            columns:
              - name: id
                type: BIGINT
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
              - name: name
                type: VARCHAR(100)
                constraints:
                  nullable: false
                  unique: true
              - name: location
                type: VARCHAR(255)
  - changeSet:
      id: create-employee-table
      author: georgepanaretos
      changes:
        - createTable:
            tableName: employee
            columns:
              - name: id
                type: BIGINT
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
              - name: address
                type: VARCHAR(255)
              - name: email
                type: VARCHAR(255)
                constraints:
                  nullable: false
                  unique: true
              - name: employee_code
                type: VARCHAR(255)
                constraints:
                  nullable: false
                  unique: true
              - name: image_url
                type: VARCHAR(255)
              - name: job_title
                type: VARCHAR(255)
              - name: name
                type: VARCHAR(255)
                constraints:
                  nullable: false
              - name: phone
                type: VARCHAR(255)
                constraints:
                  unique: true
              - name: department_id
                type: BIGINT
                constraints:
                  nullable: false
                  foreignKeyName: fk_department_id
                  references: department(id)
              - name: date_of_birth
                type: DATE
              - name: hire_date
                type: DATE
              - name: is_active
                type: BOOLEAN
                defaultValueBoolean: true
              - name: created_at
                type: TIMESTAMP
                defaultValueComputed: CURRENT_TIMESTAMP
              - name: updated_at
                type: TIMESTAMP
                defaultValueComputed: "CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP"
              - name: identification_number
                type: VARCHAR(50)
                constraints:
                  nullable: false
                  unique: true
              - name: emergency_contact_name
                type: VARCHAR(255)
              - name: emergency_contact_phone
                type: VARCHAR(255)
              - name: emergency_contact_relationship
                type: VARCHAR(100)
              - name: education_level
                type: VARCHAR(100)
              - name: nationality
                type: VARCHAR(100)
              - name: marital_status
                type: VARCHAR(50)
              - name: contract_type
                type: VARCHAR(100)
              - name: job_level
                type: VARCHAR(100)
              - name: supervisor_name
                type: VARCHAR(255)
              - name: supervisor_email
                type: VARCHAR(255)
              - name: work_location
                type: VARCHAR(255)
              - name: bank_account_number
                type: VARCHAR(100)
              - name: tax_id_number
                type: VARCHAR(100)
              - name: social_security_number
                type: VARCHAR(100)
              - name: employment_status
                type: VARCHAR(50)
              - name: termination_date
                type: DATE
              - name: notes
                type: TEXT
  - changeSet:
      id: create-indexes
      author: georgepanaretos
      changes:
        - createIndex:
            indexName: idx_email
            tableName: employee
            columns:
              - name: email
        - createIndex:
            indexName: idx_employee_code
            tableName: employee
            columns:
              - name: employee_code
        - createIndex:
            indexName: idx_identification_number
            tableName: employee
            columns:
              - name: identification_number